server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Single-page application: unknown paths are routes, not missing files.
  location / {
    try_files $uri $uri/ /index.html;
    # No application response is cached in a shared cache, because responses in
    # this platform can carry protected health information.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Content-addressed build assets are immutable and safe to cache.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
